# Perfil "demo": roda sem MySQL, usando H2 em memoria (os dados somem ao parar a aplicacao)
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=demo
spring.datasource.url=jdbc:h2:mem:oficina;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# o VS Code recompila sozinho em target/classes e o devtools reiniciava a aplicacao
# no meio da compilacao (subia sem a SecurityConfig e o login parava de funcionar)
spring.devtools.restart.enabled=false
