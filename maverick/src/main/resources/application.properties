spring.application.name=oficina
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/oficina?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# UC01 - Login (JWT). Em produção, defina JWT_SECRET (mínimo 32 caracteres)
oficina.jwt.secret=${JWT_SECRET:}
oficina.jwt.expiracao-horas=8

# Gestor criado automaticamente quando a tabela de usuários está vazia
oficina.gestor-inicial.login=${GESTOR_LOGIN:admin}
oficina.gestor-inicial.senha=${GESTOR_SENHA:admin123}