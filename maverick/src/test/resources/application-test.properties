# Perfil "test": troca o MySQL por um H2 em memoria (modo MySQL)
spring.datasource.url=jdbc:h2:mem:oficina;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# chave fixa so pros testes (minimo 32 caracteres)
oficina.jwt.secret=chave-de-teste-com-mais-de-32-caracteres-123
